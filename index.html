<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatLab Explorer</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="toolbar"></div>
  <div id="main">
    <aside id="home">
      <div class="home-h">Window List</div>
      <div id="winlist"></div>
    </aside>
    <div id="workspace"></div>
  </div>
  <div id="statusbar"><span id="status">Ready</span></div>
</div>
<input type="file" id="fileinput" accept=".csv,.tsv,.txt,.json,.jsl,.jmp" multiple hidden>

<script src="js/util.js"></script>
<script src="js/stats.js"></script>
<script src="js/datatable.js"></script>
<script src="js/samples.js"></script>

<script src="js/tableview.js"></script>
<script src="js/report.js"></script>
<script src="js/platforms/distribution.js"></script>
<script src="js/platforms/fitxy.js"></script>
<script src="js/platforms/fitmodel.js"></script>
<script src="js/platforms/multivariate.js"></script>
<script src="js/platforms/quality.js"></script>
<script src="js/platforms/misc.js"></script>
<script src="js/graphbuilder.js"></script>
<script src="js/tableops.js"></script>
<script src="js/jsl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
